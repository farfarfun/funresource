[project]
name = "funresource"
version = "1.0.57"
description = "网盘资源采集与管理工具：聚合 Acoooder、RSS、Telegram 等来源的分享链接，自动打标签后写入数据库"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "bs4>=0.0.2", "click>=8.0.0", "farlog>=1.1", "feedparser>=6.0.11", "fardb>=1.4.4", "funshell>=1.0.19", "funsecret>=1.4.84", "lxml>=4.9.0", "pandas>=1.5.0", "requests>=2.28.0", "sqlalchemy>=2.0.36", "tqdm>=4.67.1",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.scripts]
funresource = "funresource.run:funresource"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funresource"
Releases = "https://github.com/farfarfun/funresource/releases"
[dependency-groups]
dev = [ "funbuild>=1.6.65", "pytest>=8.0.0", "ruff>=0.8.0",]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I"]

[tool.setuptools]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
